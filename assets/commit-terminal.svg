<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="git commit terminal">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Consolas',monospace; font-size:14px; }
      .p  { fill:#58a6ff; }
      .c  { fill:#c9d1d9; }
      .d  { fill:#8b949e; }
      .ok { fill:#58a6ff; }
      .row{ opacity:0; }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="718" height="228" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <rect x="1" y="1" width="718" height="34" rx="12" fill="#161b22"/>
  <rect x="1" y="22" width="718" height="13" fill="#161b22"/>
  <circle cx="24" cy="18" r="5" fill="#30363d"/>
  <circle cx="42" cy="18" r="5" fill="#30363d"/>
  <circle cx="60" cy="18" r="5" fill="#58a6ff"/>
  <text x="360" y="22" text-anchor="middle" class="mono d">bash — ~/agentic-planner</text>

  <g class="mono">
    <g class="row"><text x="24" y="70"><tspan class="p">$</tspan><tspan class="c"> git add .</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.3s" fill="freeze"/></g>

    <g class="row"><text x="24" y="98"><tspan class="p">$</tspan><tspan class="c"> git commit -m "feat: planner + tool router"</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.3s" fill="freeze"/></g>

    <g class="row"><text x="24" y="120"><tspan class="d"> 4 files changed, 214 insertions(+), 12 deletions(-)</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.3s" fill="freeze"/></g>

    <g class="row"><text x="24" y="150"><tspan class="p">$</tspan><tspan class="c"> pytest -q &amp;&amp; git push origin main</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.3s" fill="freeze"/></g>

    <g class="row"><text x="24" y="172"><tspan class="d"> 48 passed in 6.2s</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.3s" fill="freeze"/></g>

    <g class="row"><text x="24" y="194"><tspan class="ok"> ✓ deployed</tspan><tspan class="d"> · benchmarks green · main up to date</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="3.2s" dur="0.3s" fill="freeze"/></g>

    <text x="24" y="216"><tspan class="p">$</tspan></text>
    <rect x="38" y="205" width="9" height="14" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
