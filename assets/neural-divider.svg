<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="60" viewBox="0 0 1200 60" preserveAspectRatio="none" role="img" aria-label="neural signal divider">
  <defs>
    <filter id="sig" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- network baseline -->
  <line x1="40" y1="30" x2="1160" y2="30" stroke="#21262d" stroke-width="1.2"/>

  <!-- nodes -->
  <g fill="#30363d" stroke="#58a6ff" stroke-width="1">
    <circle cx="60" cy="30" r="4"/>
    <circle cx="200" cy="30" r="4"/>
    <circle cx="340" cy="30" r="4"/>
    <circle cx="480" cy="30" r="4"/>
    <circle cx="620" cy="30" r="4"/>
    <circle cx="760" cy="30" r="4"/>
    <circle cx="900" cy="30" r="4"/>
    <circle cx="1040" cy="30" r="4"/>
    <circle cx="1140" cy="30" r="4"/>
  </g>

  <!-- traveling signals -->
  <g fill="#58a6ff" filter="url(#sig)">
    <circle cy="30" r="3.4"><animate attributeName="cx" values="40;1160" dur="3.4s" repeatCount="indefinite" calcMode="linear"/></circle>
    <circle cy="30" r="3.4"><animate attributeName="cx" values="40;1160" dur="3.4s" begin="1.1s" repeatCount="indefinite" calcMode="linear"/></circle>
    <circle cy="30" r="3.4"><animate attributeName="cx" values="40;1160" dur="3.4s" begin="2.2s" repeatCount="indefinite" calcMode="linear"/></circle>
  </g>
</svg>
