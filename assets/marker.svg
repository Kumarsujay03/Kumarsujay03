<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26" role="img" aria-label="section marker">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="rotate(45 13 13)">
    <!-- outer glow (breathes) -->
    <rect x="6" y="6" width="14" height="14" rx="3" fill="#58a6ff" filter="url(#glow)" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <!-- diamond body -->
    <rect x="7.5" y="7.5" width="11" height="11" rx="2.5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.6"/>
    <!-- inner spark -->
    <rect x="10.5" y="10.5" width="5" height="5" rx="1.5" fill="#58a6ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
