<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="Sujay Kumar — system info card">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Consolas',monospace; }
      .lbl  { fill:#58a6ff; }
      .val  { fill:#c9d1d9; }
      .dim  { fill:#8b949e; }
      .art  { fill:#58a6ff; }
      .row  { opacity:0; }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="718" height="288" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="1" y="1" width="718" height="34" rx="12" fill="#161b22"/>
  <rect x="1" y="22" width="718" height="13" fill="#161b22"/>
  <circle cx="24" cy="18" r="5" fill="#30363d"/>
  <circle cx="42" cy="18" r="5" fill="#30363d"/>
  <circle cx="60" cy="18" r="5" fill="#58a6ff"/>
  <text x="360" y="22" text-anchor="middle" class="mono dim" font-size="12">sujay@ml: ~</text>

  <!-- ASCII mark (SK) -->
  <g class="mono art" font-size="15" font-weight="700">
    <text x="34" y="86"> ___  _  __</text>
    <text x="34" y="106">/ __|| |/ /</text>
    <text x="34" y="126">\__ \|   &lt;</text>
    <text x="34" y="146">|___/|_|\_\</text>
  </g>
  <text x="34" y="182" class="mono lbl" font-size="12">sujay@ml</text>
  <text x="34" y="198" class="mono dim" font-size="12">------------------</text>

  <!-- info rows (reveal in sequence) -->
  <g class="mono" font-size="14">
    <g class="row"><text x="270" y="86"><tspan class="lbl">host</tspan><tspan class="dim">  ~ </tspan><tspan class="val">Sujay Kumar</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/></g>
    <g class="row"><text x="270" y="112"><tspan class="lbl">role</tspan><tspan class="dim">  ~ </tspan><tspan class="val">Software Engineer @ Accenture</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.4s" fill="freeze"/></g>
    <g class="row"><text x="270" y="138"><tspan class="lbl">past</tspan><tspan class="dim">  ~ </tspan><tspan class="val">Research Intern @ ARIES</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.4s" fill="freeze"/></g>
    <g class="row"><text x="270" y="164"><tspan class="lbl">edu</tspan><tspan class="dim">   ~ </tspan><tspan class="val">B.Tech ECE — GKV, 2025</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.4s" fill="freeze"/></g>
    <g class="row"><text x="270" y="190"><tspan class="lbl">focus</tspan><tspan class="dim"> ~ </tspan><tspan class="val">LLMs · Agents · Financial ML · NLP</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.4s" fill="freeze"/></g>
    <g class="row"><text x="270" y="216"><tspan class="lbl">tools</tspan><tspan class="dim"> ~ </tspan><tspan class="val">PyTorch · Transformers · FastAPI</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="2.3s" dur="0.4s" fill="freeze"/></g>
    <g class="row"><text x="270" y="242"><tspan class="lbl">stack</tspan><tspan class="dim"> ~ </tspan><tspan class="val">Python · TypeScript · Docker · AWS</tspan></text>
      <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.4s" fill="freeze"/></g>
  </g>

  <!-- prompt + blinking cursor -->
  <g class="mono" font-size="14">
    <text x="34" y="266"><tspan class="lbl">sujay@ml</tspan><tspan class="dim"> ~ $</tspan></text>
    <rect x="118" y="255" width="9" height="15" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
