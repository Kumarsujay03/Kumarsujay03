<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none" role="img" aria-label="Sujay Kumar — animated constellation banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f141b"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#glow)"/>

  <!-- connecting web (lines pulse to fake the "forming" effect) -->
  <g stroke="#3a4048" stroke-width="1">
    <line x1="150" y1="70"  x2="320" y2="130"><animate attributeName="opacity" values="0;0.7;0" dur="6s" repeatCount="indefinite"/></line>
    <line x1="320" y1="130" x2="480" y2="60" ><animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="1s" repeatCount="indefinite"/></line>
    <line x1="480" y1="60"  x2="640" y2="150"><animate attributeName="opacity" values="0;0.75;0" dur="5.5s" begin="0.5s" repeatCount="indefinite"/></line>
    <line x1="640" y1="150" x2="820" y2="80" ><animate attributeName="opacity" values="0;0.6;0" dur="6.5s" begin="1.5s" repeatCount="indefinite"/></line>
    <line x1="820" y1="80"  x2="980" y2="160"><animate attributeName="opacity" values="0;0.7;0" dur="7.5s" begin="0.8s" repeatCount="indefinite"/></line>
    <line x1="980" y1="160" x2="1080" y2="90"><animate attributeName="opacity" values="0;0.65;0" dur="6s" begin="2s" repeatCount="indefinite"/></line>
    <line x1="320" y1="130" x2="480" y2="200"><animate attributeName="opacity" values="0;0.5;0" dur="8s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="640" y1="150" x2="820" y2="210"><animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="1.2s" repeatCount="indefinite"/></line>
    <line x1="150" y1="70"  x2="260" y2="190"><animate attributeName="opacity" values="0;0.5;0" dur="9s" begin="0.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- drifting particle nodes -->
  <g fill="#c9d1d9">
    <circle cx="150" cy="70" r="2.5"><animate attributeName="cy" values="70;78;70" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="130" r="3"><animate attributeName="cx" values="320;332;320" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="60" r="2"><animate attributeName="cy" values="60;52;60" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="150" r="3.2"><animate attributeName="cx" values="640;626;640" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="80" r="2.4"><animate attributeName="cy" values="80;88;80" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="160" r="2.8"><animate attributeName="cx" values="980;968;980" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.95;0.5" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="90" r="2"><animate attributeName="cy" values="90;82;90" dur="8.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.9;0.4" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="190" r="2.2"><animate attributeName="cy" values="190;198;190" dur="10.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.85;0.4" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="200" r="2.6"><animate attributeName="cx" values="480;492;480" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="210" r="2.3"><animate attributeName="cy" values="210;202;210" dur="11.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.9;0.4" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="130" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="1">Sujay Kumar</text>
    <text x="600" y="162" font-size="16" font-weight="400" fill="#8b949e" letter-spacing="3">MACHINE LEARNING ENGINEER · AI RESEARCHER</text>
  </g>
</svg>
